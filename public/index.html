<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destrava</title>
<meta name="description" content="Aprenda inglês do zero falando. A professora Larissa corrige sua pronúncia e conversa com você.">
<meta name="theme-color" content="#0B6E75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Destrava">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B6E75'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='Georgia,serif'%3ED%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B6E75'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='Georgia,serif'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme:light dark;
    padding-top:env(safe-area-inset-top, 0px);
    --bg:#E9EDEF; --surface:#FFFFFF; --surface-2:#F1F5F6;
    --ink:#0F1A1F; --ink-2:#4E626A; --ink-3:#83979E;
    --line:#CFDADE; --line-2:#E1E9EB;
    --accent:#0B6E75; --accent-ink:#FFFFFF; --accent-soft:#D6E9E9;
    --signal:#A96411; --signal-soft:#F3E3CA;
    --good:#256B4E; --good-soft:#D6EADF;
    --bad:#9E3327; --bad-soft:#F5DCD8;
    --shadow:0 1px 2px rgba(15,26,31,.05), 0 8px 24px rgba(15,26,31,.07);
    --r:14px;
    --sans:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1315; --surface:#131F22; --surface-2:#1A292D;
      --ink:#E7EEEF; --ink-2:#9AAFB5; --ink-3:#6F868D;
      --line:#26383D; --line-2:#1E2E32;
      --accent:#4FBFC4; --accent-ink:#06282B; --accent-soft:#16383B;
      --signal:#E0A550; --signal-soft:#3A2C16;
      --good:#61C294; --good-soft:#15332690;
      --bad:#EA8073; --bad-soft:#3A1C18;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1315; --surface:#131F22; --surface-2:#1A292D;
    --ink:#E7EEEF; --ink-2:#9AAFB5; --ink-3:#6F868D;
    --line:#26383D; --line-2:#1E2E32;
    --accent:#4FBFC4; --accent-ink:#06282B; --accent-soft:#16383B;
    --signal:#E0A550; --signal-soft:#3A2C16;
    --good:#61C294; --good-soft:#15332690;
    --bad:#EA8073; --bad-soft:#3A1C18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0; min-height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  button,input,textarea,select{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  .shell{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 104px}

  .topbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line-2);
    margin-inline:-16px; padding:10px 16px;
    display:flex; align-items:center; gap:9px;
  }
  .brand{font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-.01em; margin-right:auto}
  .brand em{font-style:normal; color:var(--accent)}
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px; font-weight:600; padding:4px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line-2);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .chip.flame{background:var(--signal-soft); color:var(--signal); border-color:transparent}

  .nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; background:var(--surface); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .nav button{
    flex:1; background:none; border:0; padding:7px 4px 5px; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; font-weight:600; color:var(--ink-3); letter-spacing:.02em;
  }
  .nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .nav button[aria-current="page"]{color:var(--accent)}
  @media (min-width:900px){
    .nav{left:0; right:auto; top:0; bottom:0; width:96px; flex-direction:column;
      justify-content:center; gap:6px; border-top:0; border-right:1px solid var(--line); padding:8px}
    .nav button{flex:0 0 auto; padding:12px 4px}
    body{padding-left:96px}
  }

  h2{font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:-.015em; margin:0; text-wrap:balance}
  h3{font-size:15px; font-weight:700; margin:0; letter-spacing:-.005em}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
  .lead{color:var(--ink-2); margin:0; font-size:14.5px}
  .fig{font-family:var(--mono); font-size:13px; color:var(--accent); letter-spacing:-.02em}
  .en{font-family:var(--serif); font-size:19px; line-height:1.38}

  /* Telas largas: a coluna cresce, mas o texto de leitura continua estreito —
     linha longa demais cansa. So a trilha usa a largura inteira, em duas colunas. */
  @media (min-width:1180px){
    .shell{max-width:1060px}
    #view > *{width:100%; max-width:770px; align-self:center}
    #view > .mods, #view > .comLarissa{max-width:none}
    .mods{display:grid; grid-template-columns:1fr 1fr; gap:4px 40px; align-items:start}
    .mods .mod:nth-child(-n+2){margin-top:12px}
  }

  /* Larissa pequena, para acompanhar a licao sem roubar a cena */
  .palco.mini{flex-direction:row; align-items:center; gap:12px; justify-content:flex-start}
  .palco.mini .halo{width:76px; flex:0 0 auto}
  .palco.mini .legenda{text-align:left; min-height:0}

  .escolha{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:640px){ .escolha{grid-template-columns:1fr 1fr} }
  .cartao{
    background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r);
    padding:22px 18px; display:flex; flex-direction:column; gap:8px; align-items:flex-start;
    text-align:left; color:inherit; transition:border-color .2s ease, transform .2s ease;
  }
  .cartao:hover{border-color:var(--accent); transform:translateY(-2px)}
  .cartao.atual{border-color:var(--accent); cursor:default}
  .cartao.atual:hover{transform:none}
  .cartao .sigla{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em;
    color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px;
  }
  .cartao .nome{font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:-.015em}
  .cartao .info{font-size:13.5px; color:var(--ink-2)}
  .cartao .bar{width:100%; margin-top:4px}

  /* Larissa dando o recado na trilha */
  /* A Larissa fica FORA do balao: ele carrega so a fala, e ela em pe ao
     lado, do tamanho de gente. O balao alinha pela base dela. */
  .recado{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end}
  .recado .balao{
    background:var(--surface); border-radius:var(--r); padding:16px 18px;
    box-shadow:var(--shadow); position:relative;
  }
  /* bicinho do balao apontando para ela */
  .recado .balao::after{
    content:""; position:absolute; right:-9px; bottom:26px; width:0; height:0;
    border-top:9px solid transparent; border-bottom:9px solid transparent;
    border-left:10px solid var(--surface);
  }
  .recado .texto{display:flex; flex-direction:column; gap:8px; min-width:0}
  .recado .palco{width:182px; gap:0}
  .recado .palco .halo{width:182px}
  .recado .palco .legenda{display:none}
  @media (max-width:640px){
    .recado{grid-template-columns:1fr 116px; gap:4px}
    .recado .palco, .recado .palco .halo{width:116px}
    .recado .balao::after{display:none}
  }
  .recado .fala{font-family:var(--serif); font-size:17px; line-height:1.35; text-wrap:balance}
  .recado .acoes{display:flex; gap:8px; flex-wrap:wrap}
  @media (min-width:640px){ .recado .palco .halo{width:104px} }

  .palco[data-larissa="feliz"] .halo{animation:pulinho .45s ease 2}
  @keyframes pulinho{0%,100%{transform:translateY(0)}38%{transform:translateY(-9px)}}
  @media (prefers-reduced-motion: reduce){ .palco[data-larissa="feliz"] .halo{animation:none} }

  .avisoCota{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:60;
    max-width:min(94vw, 460px); background:var(--signal-soft); color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:13.5px; line-height:1.45;
    box-shadow:var(--shadow); display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  }
  @media (min-width:900px){ .avisoCota{bottom:24px} }

  .vozes{display:flex; flex-wrap:wrap; gap:7px}
  .vozbt{
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-2);
    padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:600;
  }
  .vozbt:hover{border-color:var(--accent)}
  .vozbt.atual{border-color:transparent; background:var(--accent); color:var(--accent-ink)}
  .vozbt[disabled]{opacity:.55}

  .stack{display:flex; flex-direction:column; gap:16px}
  .stack-s{display:flex; flex-direction:column; gap:9px}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}

  .panel{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r); padding:16px}
  .panel.lift{box-shadow:var(--shadow); border-color:transparent}

  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:10px 16px; border-radius:10px; font-size:14.5px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn[disabled]{opacity:.45; cursor:default}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2); padding-inline:10px}
  .btn.wide{width:100%}
  .btn.sm{padding:6px 11px; font-size:13px; border-radius:8px}

  .hero{
    background:var(--surface); border-radius:var(--r); padding:18px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:13px;
    border-left:4px solid var(--accent);
  }
  .hero .n{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s ease}

  .mod{margin-top:22px}
  .mod-head{display:flex; align-items:baseline; gap:10px; padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:2px}
  .mod-head .t{font-weight:700; font-size:14.5px}
  .mod-head .c{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-3)}
  .les{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:0; border-bottom:1px solid var(--line-2); padding:12px 2px; color:inherit;
  }
  .les:hover{background:var(--surface-2)}
  .les .dot{
    flex:0 0 auto; width:25px; height:25px; border-radius:50%;
    border:1.5px solid var(--line); display:grid; place-items:center;
    font-family:var(--mono); font-size:11px; color:var(--ink-3);
  }
  .les.done .dot{background:var(--good); border-color:transparent; color:#fff}
  .les.done .dot svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .les .t{font-size:14.5px; font-weight:500; flex:1; min-width:0}
  .les .s{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}

  .ex{background:var(--surface-2); border-radius:11px; padding:13px 14px}
  .ex .pt{color:var(--ink-2); font-size:14px; margin-top:2px}
  .ex .fig{display:block; margin-top:5px}
  .speak{
    border:0; background:var(--accent-soft); color:var(--accent);
    width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto;
  }
  .speak svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

  .opt{
    display:block; width:100%; text-align:left; background:var(--surface);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14.5px; margin-top:8px;
  }
  .opt:hover{border-color:var(--accent)}
  .opt.right{border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:600}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
  .opt[disabled]{cursor:default}
  .why{font-size:13.5px; color:var(--ink-2); margin-top:10px; padding-left:11px; border-left:2px solid var(--line)}
  .inp{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--surface); font-size:15px; font-family:inherit;
  }
  .inp:focus{border-color:var(--accent); outline:none}
  select.inp{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:calc(100% - 17px) 20px, calc(100% - 12px) 20px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:36px}

  .seg{display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px}
  .seg button{flex:1; border:0; background:none; padding:8px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(15,26,31,.09)}

  .msgs{display:flex; flex-direction:column; gap:12px; min-height:150px}
  .msg{max-width:88%; display:flex; flex-direction:column; gap:4px}
  .msg.me{align-self:flex-end; align-items:flex-end}
  .bub{padding:10px 13px; border-radius:15px; font-size:15px}
  .msg.them .bub{background:var(--surface-2); border-bottom-left-radius:5px; font-family:var(--serif); font-size:17.5px; line-height:1.4}
  .msg.me .bub{background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px}
  .sub{font-size:13px; color:var(--ink-3); padding-inline:4px}
  .fixcard{background:var(--signal-soft); border-radius:11px; padding:10px 12px; font-size:13.5px; display:flex; flex-direction:column; gap:3px}
  .fixcard .lbl{font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--signal)}
  .fixcard .txt{font-family:var(--serif); font-size:16px; color:var(--ink)}
  .fixcard .tip{color:var(--ink-2)}

  .composer{display:flex; gap:8px; align-items:flex-end; margin-top:14px}
  .composer .inp{flex:1; resize:none; max-height:120px; line-height:1.35}
  .mic{flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
  .mic svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .mic.rec{background:var(--bad); animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(158,51,39,.5)}50%{box-shadow:0 0 0 11px rgba(158,51,39,0)}}

  .target{font-family:var(--serif); font-size:27px; line-height:1.35; letter-spacing:-.01em; display:flex; flex-wrap:wrap; gap:0 9px}
  .target .w{padding:0 2px; border-radius:4px; border-bottom:2.5px solid transparent}
  .target .w.hit{border-bottom-color:var(--good)}
  .target .w.miss{border-bottom-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
  .score{font-family:var(--mono); font-size:38px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
  .heard{font-family:var(--mono); font-size:13px; color:var(--ink-2); word-break:break-word}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
  .tile{background:var(--surface); border:1px solid var(--line-2); border-radius:12px; padding:13px 12px}
  .tile .v{font-family:var(--mono); font-size:25px; font-weight:500; line-height:1.1; font-variant-numeric:tabular-nums}
  .tile .k{font-size:11.5px; color:var(--ink-3); margin-top:3px; font-weight:600}
  .mistake{display:flex; flex-direction:column; gap:2px; padding:11px 0; border-bottom:1px solid var(--line-2)}
  .mistake .was{font-size:13.5px; color:var(--bad); text-decoration:line-through; text-decoration-thickness:1px}
  .mistake .now{font-family:var(--serif); font-size:16.5px}
  .mistake .tip{font-size:13px; color:var(--ink-2)}

  .note{font-size:13px; color:var(--ink-2); background:var(--surface-2); border-radius:10px; padding:10px 12px; display:flex; gap:8px; align-items:flex-start}
  .note b{color:var(--ink)}
  .note.warn{background:var(--signal-soft); color:var(--ink-2)}
  .empty{text-align:center; color:var(--ink-3); font-size:14px; padding:26px 12px}

  /* ---------- Larissa ---------- */
  .palco{position:relative; display:flex; flex-direction:column; align-items:center; gap:10px}
  .palco .halo{
    position:relative; width:min(64vw, 260px); aspect-ratio:1;
    overflow:visible; background:none;
  }
  /* brilho difuso no lugar da moldura: ela fica solta na pagina */
  .palco .halo::before{
    content:""; position:absolute; inset:6% 4% 14% 4%; border-radius:50%;
    background:radial-gradient(circle at 50% 42%, var(--accent-soft), transparent 68%);
    opacity:.7; transition:opacity .35s ease;
  }
  .palco[data-larissa="ouvindo"] .halo::before{
    background:radial-gradient(circle at 50% 42%, rgba(192,90,99,.34), transparent 68%);
    animation:brilhoPulso 1.6s ease-in-out infinite;
  }
  .palco[data-larissa="falando"] .halo::before{opacity:1}
  @keyframes brilhoPulso{0%,100%{opacity:.45}50%{opacity:1}}
  .palco .halo svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
  .palco .halo svg{width:100%; height:100%; display:block}

  /* o corpo inteiro respira; a cabeca reage ao estado */
  .bn{transform-origin:100px 190px; animation:bnRespira 4.4s ease-in-out infinite}
  .bn-cabeca{transform-origin:100px 126px; transition:transform .45s cubic-bezier(.34,1.3,.5,1)}
  .palco[data-larissa="ouvindo"] .bn-cabeca{transform:rotate(-7deg) translateY(-1px)}
  .palco[data-larissa="pensando"] .bn-cabeca{transform:rotate(5deg)}
  .palco[data-larissa="falando"] .bn-cabeca{animation:bnAcena 1.05s ease-in-out infinite}
  .palco[data-larissa="feliz"] .bn{animation:bnPula .5s ease 2}

  /* piscar: os olhos achatam por um instante */
  .bn-olho{transform-box:fill-box; transform-origin:center; animation:bnPisca 5.2s infinite}
  .bn-olho.d{animation-delay:.06s}
  @keyframes bnPisca{0%,94%,100%{transform:scaleY(1)} 96%,97.5%{transform:scaleY(.08)}}

  /* as mechas balancam com atraso, como cabelo de verdade */

function ler(chave, padrao, alternativas){
  // Tenta a chave do usuário e, se ainda não existir, os nomes anteriores —
  // assim ninguém perde o progresso feito antes do login existir.
  for(const k of [chave, ...(alternativas || [])]){
    if(!k) continue;
    try{ const r = localStorage.getItem(k); if(r) return Object.assign(padrao(), JSON.parse(r)); }catch(e){}
  }
  return padrao();
}
let adiado = null, fila = Promise.resolve();

function gravar(){
  S.em = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  pintarTopo();

  // O aparelho e a verdade imediata; a nuvem recebe a copia pouco depois,
  // para o progresso seguir a pessoa de um aparelho para outro.
  if(!NUVEM || !UID || UID === "local") return;
  clearTimeout(adiado);
  adiado = setTimeout(() => {
    const copia = JSON.parse(JSON.stringify(S));
    copia.licoesFeitas = Object.keys(S.feitas).length;
    const doc = {email: EMAIL, visto: new Date().toISOString(), ultimoIdioma: IDIOMA};

    fila = fila.then(() => NUVEM.collection("usuarios").doc(UID).set(doc, {merge:true})).catch(() => {});

}

  if(!NUVEM || !UID || UID === "local") return;

function corpo({prompt, turnos, sistema, json, rapido}){
  const b = {
    contents: turnos && turnos.length
      ? turnos.map(t => ({role: t.role === "assistant" ? "model" : "user", parts:[{text:t.content}]}))
      : [{role:"user", parts:[{text:prompt}]}],
    generationConfig: {temperature: json ? 0.4 : 0.85, maxOutputTokens: json ? 3000 : 700},
  };
  if(sistema) b.systemInstruction = {parts:[{text:sistema}]};
  if(json) b.generationConfig.responseMimeType = "application/json";
  if(rapido && aceitaSemPensar(modeloEmUso())) b.generationConfig.thinkingConfig = {thinkingBudget:0};
  return b;
}

class ErroIA extends Error{
  constructor(codigo, msg){ super(msg); this.codigo = codigo; }
}

function traduzErro(status, texto){
  const t = String(texto || "");
  if(status === 400 && /API[_ ]key not valid|API_KEY_INVALID/i.test(t))
    return new ErroIA("chave", "Chave da API inválida. Confira em Ajustes.");
  if(status === 400) return new ErroIA("pedido", "O Gemini recusou o pedido. Tente de novo ou troque o modelo em Ajustes.");
  if(status === 403) return new ErroIA("chave", "Essa chave não tem permissão para a API Gemini. Gere outra no Google AI Studio.");
  if(status === 404) return new ErroIA("modelo", `O modelo "${modeloEmUso()}" não foi encontrado. Escolha outro em Ajustes.`);
  if(status === 429) return new ErroIA("limite", "Você bateu o limite de uso do Gemini. Espere alguns minutos.");
  if(status === 503) return new ErroIA("fora", "Esse modelo está congestionado. Tente de novo, ou troque de modelo em Ajustes.");
  return new ErroIA("rede", "Não consegui falar com o Gemini. Confira sua internet.");
}

async function pedirUmaVez(opts){
  if(!temChave()) throw new ErroIA("chave", "Falta a chave da API. Vá em Ajustes.");
  let r;
  try{
    r = await fetch(rotaIA("generateContent", false), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(corpo(opts)), signal: opts.signal,
    });
  }catch(e){
    if(e?.name === "AbortError") throw new ErroIA("cancelado", "");
    throw new ErroIA("rede", "Sem conexão com o Gemini.");
  }
  if(!r.ok) throw traduzErro(r.status, await r.text().catch(() => ""));
  const d = await r.json();
  const txt = (d?.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
  if(!txt){
    const bloqueio = d?.promptFeedback?.blockReason || d?.candidates?.[0]?.finishReason;
    throw new ErroIA("vazio", bloqueio === "SAFETY" ? "O Gemini bloqueou esse conteúdo. Mude o assunto." : "Veio vazio. Tente de novo.");
  }
  return txt;
}

async function pedirStreamUmaVez(opts, onTexto){
  if(!temChave()) throw new ErroIA("chave", "Falta a chave da API. Vá em Ajustes.");
  let r;
  try{
    r = await fetch(rotaIA("streamGenerateContent", true), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(corpo(opts)), signal: opts.signal,
    });
  }catch(e){
    if(e?.name === "AbortError") throw new ErroIA("cancelado", "");
    throw new ErroIA("rede", "Sem conexão com o Gemini.");
  }
  if(!r.ok) throw traduzErro(r.status, await r.text().catch(() => ""));
  if(!r.body) return pedir(opts);

  const leitor = r.body.getReader(), dec = new TextDecoder();
  let buf = "", todo = "";
  try{
    for(;;){
      const {done, value} = await leitor.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const linhas = buf.split("\n");
      buf = linhas.pop() ?? "";
      for(const linha of linhas){
        if(!linha.startsWith("data:")) continue;
        const cru = linha.slice(5).trim();
        if(!cru || cru === "[DONE]") continue;
        try{
          const d = JSON.parse(cru);
          const t = (d?.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
          if(t){ todo += t; onTexto?.(todo); }
        }catch(e){}
      }
    }
  }catch(e){
    if(e?.name === "AbortError") throw new ErroIA("cancelado", "");
    if(!todo) throw new ErroIA("rede", "A conexão caiu no meio da resposta.");
  }
  if(!todo.trim()) throw new ErroIA("vazio", "Veio vazio. Tente de novo.");
  return todo.trim();
}

const congestionado = e => e?.codigo === "fora" || e?.codigo === "limite";

async function pedir(opts){
  try{ return await pedirUmaVez(opts); }
  catch(e){
    if(!congestionado(e) || modeloEmUso() === RESERVA) throw e;
    modeloReserva = true;                    // segue no reserva pelo resto da sessão
    return await pedirUmaVez(opts);
  }
}

async function pedirStream(opts, onTexto){
  try{ return await pedirStreamUmaVez(opts, onTexto); }
  catch(e){
    if(!congestionado(e) || modeloEmUso() === RESERVA) throw e;
    modeloReserva = true;
    return await pedirStreamUmaVez(opts, onTexto);
  }
}

/* Lê JSON tolerante: o texto inteiro, o miolo de uma cerca ``` ou do 1º { ao último }. */
function comoJSON(txt){
  const tentar = s => { try{ return JSON.parse(s); }catch(e){ return null; } };
  let d = tentar(txt);
  if(d) return d;
  const cerca = txt.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(cerca && (d = tentar(cerca[1].trim()))) return d;
  const a = txt.search(/[[{]/), b = Math.max(txt.lastIndexOf("}"), txt.lastIndexOf("]"));
  if(a >= 0 && b > a && (d = tentar(txt.slice(a, b+1)))) return d;
  throw new ErroIA("json", "A resposta veio embaralhada. Toque de novo.");
}
const pedirJSON = async opts => comoJSON(await pedir({...opts, json:true}));

/* Palmas sintetizadas: um estouro curto de ruido filtrado. Evita carregar
   arquivo de audio so para comemorar. */
function palmas(n){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    for(let i = 0; i < n; i++){
      const quando = ctx.currentTime + i * 0.17;
      const dur = 0.085, amostras = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, amostras, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let j = 0; j < amostras; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / amostras, 3.2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 0.7;
      const g = ctx.createGain(); g.gain.value = 0.18;
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start(quando);
    }
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1400);
  }catch(e){}
}

/* A voz do Gemini e a mesma em portugues e em ingles — a Larissa deixa de
   ter dois timbres. Custa uma chamada e alguns segundos na primeira vez, por
   isso cada frase fica guardada; repetir e instantaneo. Sem servidor ou sem
   cota, cai na voz do aparelho, que e instantanea mas robotica. */

const MODELO_TTS = "gemini-3.1-flash-tts-preview";
const VOZES_IA = ["Kore", "Leda", "Aoede", "Callirrhoe", "Autonoe", "Despina", "Sulafat", "Zephyr"];

const cacheVoz = new Map();   // texto -> URL, nesta sessao
let tocando = null;
let semCotaHoje = false;      // o Gemini ja recusou hoje: nao insiste

/* Cofre de audio no proprio navegador. Importa porque o plano gratuito da
   apenas 10 geracoes de voz por dia: o que foi gerado uma vez nunca mais
   precisa ser gerado. As frases fixas — as dicas da Larissa — acabam
   guardadas de vez, e passam a tocar na hora, de graca, para sempre. */
const VOZ_DB = "destrava-voz";
let bancoVoz = null;

function abrirBancoVoz(){
  if(bancoVoz) return bancoVoz;
  bancoVoz = new Promise(res => {
    try{
      const req = indexedDB.open(VOZ_DB, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("audios"); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    }catch(e){ res(null); }
  });
  return bancoVoz;
}

async function doCofre(chave){
  const db = await abrirBancoVoz(); if(!db) return null;
  return new Promise(res => {
    try{
      const p = db.transaction("audios", "readonly").objectStore("audios").get(chave);
      p.onsuccess = () => res(p.result || null);
      p.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}

async function paraCofre(chave, blob){
  const db = await abrirBancoVoz(); if(!db) return;
  try{ db.transaction("audios", "readwrite").objectStore("audios").put(blob, chave); }catch(e){}
}

/* O Gemini devolve PCM cru; o navegador toca WAV. Sao 44 bytes de cabecalho. */
function pcmParaWav(pcm, taxa){
  const n = pcm.byteLength, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const escrever = (o, t) => { for(let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  escrever(0, "RIFF");  v.setUint32(4, 36 + n, true);
  escrever(8, "WAVE");  escrever(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, taxa, true); v.setUint32(28, taxa * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  escrever(36, "data"); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).set(new Uint8Array(pcm));
  return new Blob([buf], {type:"audio/wav"});
}

const VOZ_AZ_PADRAO = "pt-BR-FranciscaNeural";

async function gerarVozAzure(texto, voz){

async function gerarVoz(texto){
  if(semCotaHoje) return null;
  const r = await fetch(`${PROXY}/api/gemini/${MODELO_TTS}:generateContent`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      contents:[{parts:[{text: texto}]}],
      generationConfig:{
        responseModalities:["AUDIO"],
        speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName: CFG.vozIA || "Kore"}}},
      },
    }),
  });
  const d = await r.json().catch(() => null);
  if(!r.ok){
    const m = String(d?.error?.message || "");
    if(r.status === 429 || /quota/i.test(m)){
      semCotaHoje = true;
      avisarCota();
    }
    return null;
  }
  const parte = ((d?.candidates?.[0]?.content?.parts) || []).find(p => p.inlineData);
  if(!parte) return null;
  const bruto = atob(parte.inlineData.data);
  const bytes = new Uint8Array(bruto.length);
  for(let i = 0; i < bruto.length; i++) bytes[i] = bruto.charCodeAt(i);
  const taxa = Number((String(parte.inlineData.mimeType).match(/rate=(\d+)/) || [])[1]) || 24000;
  return pcmParaWav(bytes.buffer, taxa);
}

/* Gerar voz leva alguns segundos. Se a frase ja esta prevista — a dica da
   trilha, por exemplo — da para preparar em silencio enquanto a pessoa le,
   e o clique fica instantaneo. */
async function aquecerVoz(texto){
  if(!SERVIDOR || CFG.natural === false || !texto) return;
  if(!AZURE && semCotaHoje) return;
  const motor = AZURE ? "az" : "gem";
  const vozAtual = AZURE ? (CFG.vozAzure || VOZ_AZ_PADRAO) : (CFG.vozIA || "Kore");
  const chave = motor + "|" + vozAtual + "|" + texto;
  if(cacheVoz.has(chave)) return;
  try{
    let blob = await doCofre(chave);
    if(!blob){
      blob = AZURE ? await gerarVozAzure(texto, vozAtual) : await gerarVoz(texto);
      if(blob) paraCofre(chave, blob);
    }
    if(blob) cacheVoz.set(chave, URL.createObjectURL(blob));
  }catch(e){}
}

/* Diz o texto com a melhor voz disponivel. `reserva` e a funcao que fala
   com a voz do aparelho, caso a do Gemini nao venha. */
async function dizer(texto, reserva){
  if(!texto) return;
  pararVoz();
  if(!SERVIDOR || CFG.natural === false) return reserva();

  // Azure primeiro: 500 mil caracteres por mes contra 10 audios por dia.
  const motor = AZURE ? "az" : "gem";
  const vozAtual = AZURE ? (CFG.vozAzure || VOZ_AZ_PADRAO) : (CFG.vozIA || "Kore");
  const chave = motor + "|" + vozAtual + "|" + texto;

  let url = cacheVoz.get(chave);
  if(!url){
    let blob = await doCofre(chave);              // ja guardado de outro dia?
    if(!blob){
      if(!AZURE && semCotaHoje) return reserva();
      const antes = Larissa.estado;
      if(antes === "parada") Larissa.pensa(true);
      try{
        blob = AZURE ? await gerarVozAzure(texto, vozAtual) : await gerarVoz(texto);
      }catch(e){ blob = null; }
      if(Larissa.estado === "pensando") Larissa.vai(antes);
      if(!blob) return reserva();                 // sem cota ou sem rede
      paraCofre(chave, blob);                     // nunca mais gera esta frase
    }
    url = URL.createObjectURL(blob);
    if(cacheVoz.size > 40){
      const velha = cacheVoz.keys().next().value;
      try{ URL.revokeObjectURL(cacheVoz.get(velha)); }catch(e){}
      cacheVoz.delete(velha);
    }
    cacheVoz.set(chave, url);
  }
  try{
    const a = new Audio(url);
    tocando = a;
    a.onplay = () => Larissa.fala(true);
    a.onended = () => { Larissa.fala(false); tocando = null; };
    a.onerror = () => { Larissa.fala(false); tocando = null; reserva(); };
    await a.play();                 // resolve quando o som comeca, nao quando acaba
  }catch(e){ reserva(); }
}

function falar(texto, taxa){ dizer(texto, () => falarAparelho(texto, taxa)); }

function falarAparelho(texto, taxa){
  if(!window.speechSynthesis || !texto) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    const v = vozLarissa();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = L().locale;
    u.rate = taxa ?? CFG.taxa ?? 0.92;
    u.pitch = 1.08;                 // um tom levemente mais alto
    u.onstart = () => Larissa.fala(true);
    u.onend   = () => Larissa.fala(false);
    u.onerror = () => Larissa.fala(false);
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================ 5. COMPARAÇÃO DE FALA ============================ */

const CONTR = {"dont":"do not","doesnt":"does not","didnt":"did not","cant":"can not","wont":"will not",
  "im":"i am","ive":"i have","ill":"i will","id":"i would","youre":"you are","youve":"you have","youll":"you will",
  "hes":"he is","shes":"she is","its":"it is","were":"we are","theyre":"they are","thats":"that is",
  "theres":"there is","havent":"have not","hasnt":"has not","isnt":"is not","arent":"are not","wasnt":"was not"};

function fichas(s){
  return String(s || "").toLowerCase()
    .replace(/[’']/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/).filter(Boolean)
    .flatMap(w => (CONTR[w] || w).split(" "));
}

/* Alinhamento por maior subsequência comum: marca cada palavra do alvo como
   acertada ou não, sem punir palavras extras que o reconhecimento inventa. */
function alinhar(alvo, ouvido){
  const a = fichas(alvo), b = fichas(ouvido);
  const n = a.length, m = b.length;
  const d = Array.from({length:n+1}, () => new Int32Array(m+1));
  for(let i = n-1; i >= 0; i--)
    for(let j = m-1; j >= 0; j--)
      d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const ok = new Array(n).fill(false);
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ ok[i] = true; i++; j++; }
    else if(d[i+1][j] >= d[i][j+1]) i++;
    else j++;
  }
  return {ok, pct: n ? Math.round(100 * ok.filter(Boolean).length / n) : 0, palavras:a};
}

const Larissa = {
  palcos: [], estado: "parada", timer: null, mexe: null,

  registrar(el){ this.palcos = [el]; this.aplicar(); },

  aplicar(){
    const t = {parada:"", falando:"falando…", ouvindo:"ouvindo você",
               pensando:"pensando…", feliz:"muito bem!"}[this.estado] || "";
    for(const p of this.palcos){
      if(!p) continue;
      p.dataset.larissa = this.estado;
      const l = p.querySelector(".legenda");
      if(!l) continue;
      if(this.estado === "parada" && p.classList.contains("mini")) l.textContent = l.dataset.repouso || "";
      else l.textContent = t;
    }
  },

  boca(nome){
    for(const p of this.palcos){
      const b = p?.querySelector("#bnBoca");
      if(b) b.setAttribute("d", BOCAS[nome] || BOCAS.fechada);
    }
  },

  vai(novo){
    if(this.estado === novo) return;
    this.estado = novo;
    this.aplicar();
    clearTimeout(this.timer);
    clearInterval(this.mexe); this.mexe = null;
    if(novo === "falando"){
      // ritmo irregular: fala nao tem metronomo
      const formas = ["leve","media","larga","o","media","leve"];
      let i = 0;
      this.mexe = setInterval(() => {
        i = (i + 1 + Math.floor(Math.random() * 2)) % formas.length;
        this.boca(formas[i]);
      }, 115);
    } else {
      this.boca(novo === "feliz" ? "sorriso" : "fechada");
    }
    if(novo === "feliz") this.timer = setTimeout(() => this.vai("parada"), 2400);
  },

  fala(on){ this.vai(on ? "falando" : "parada"); },
  ouve(on){ this.vai(on ? "ouvindo" : "parada"); },
  pensa(on){ this.vai(on ? "pensando" : "parada"); },
  comemora(bater){ this.vai("feliz"); if(bater !== false) palmas(3); },
};

const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for(const k of kids.flat()) if(k !== null && k !== undefined && k !== false)
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};

function dicaDaTrilha(){
  const feitas = Object.keys(S.feitas).length, tot = total(), p = proxima();
  const nome = L().nome.toLowerCase();
  if(feitas === 0)
    return `Oi! Sou a Larissa. Vamos começar seu ${nome} pelo começo: toque em Estudar esta lição. São poucos minutos, e eu explico tudo em português.`;
  if(!p)
    return `Você terminou as ${tot} lições de ${nome}. Agora o que faz diferença é conversar comigo todo dia, na aba Falar.`;
  if(S.streak.dia !== hoje())
    return `Que bom te ver de volta. Vamos retomar em ${p.t}? Uma lição por dia já muda muito.`;
  if(feitas >= 3 && Object.keys(S.falados).length === 0)
    return `Você está indo bem na escrita. Que tal treinar a fala? Na aba Falar tem o treino de pronúncia — eu escuto e te digo o que ajustar.`;
  if(S.erros.length >= 3)
    return `Você tem ${S.erros.length} erros guardados. Em Progresso dá para treinar exatamente eles, que é o jeito mais rápido de melhorar.`;
  return `Faltam ${tot - feitas} lições. A próxima é ${p.t} — vamos nessa?`;
}

  if(!confirm("Isso apaga as aulas já geradas. Elas serão geradas de novo quando você abrir cada lição. Continuar?")) return;
  cacheLicao = {};
  try{ localStorage.removeItem(LS_AULAS); }catch(e){}
  rotear();
}

async function verLicao(id, refazer){
  const l = byId(id);
  const cabeca = h("div", {class:"stack-s"},
    h("button", {class:"btn ghost sm", style:"align-self:flex-start; margin-left:-10px",
      onclick:() => { licaoAberta = null; rotear(); }}, "‹ Trilha"),
    h("span", {class:"eyebrow"}, `${l.mod} · lição ${l.num}`),
    h("h2", {}, l.t));

  if(!refazer && cacheLicao[id]) return montarLicao(l, cabeca, cacheLicao[id]);

  const espera = palco(true);
  Larissa.pensa(true);
  pintar(cabeca, espera, h("div", {class:"panel", style:"display:flex; gap:10px; align-items:center"},
    h("span", {class:"spin"}), h("span", {class:"lead"}, "Larissa está preparando sua aula…")));

  const sistema =
`Você é Larissa, uma professora de ${L().adj} brasileira: didática, calorosa e direta. Ensina adultos brasileiros iniciantes.
Explique SEMPRE em português do Brasil. Em todo exemplo em ${L().adj}, inclua a "pronúncia figurada" no estilo brasileiro (exemplo: ${L().figEx}).
Responda somente com JSON válido, sem comentários e sem texto fora do JSON.`;

  const prompt =
`TÓPICO DA AULA: ${l.topic}
TÍTULO QUE O ALUNO VÊ: ${l.t}

Formato exato do JSON:
{
 "resumo": "uma frase dizendo o que o aluno vai conseguir fazer depois desta lição",
 "pontos": [{"titulo":"nome curto da regra","texto":"explicação de 1 a 3 frases em português"}],
 "exemplos": [{"en":"frase em ${L().adj}","pt":"tradução","fig":"pronúncia figurada"}],
 "atencao": "um erro que brasileiros cometem neste tópico, em uma frase",
 "exercicios": [
   {"tipo":"escolha","pergunta":"enunciado em português","opcoes":["a","b","c"],"resposta":0,"porque":"por que essa é a certa"},
   {"tipo":"traduzir","pergunta":"frase em português para traduzir","resposta":"a frase em ${L().adj}","porque":"observação curta"}
 ]
}
Use 3 pontos, 5 exemplos e exatamente 5 exercícios misturando os dois tipos. Em "escolha", "resposta" é o índice da opção certa.${refazer ? " Esta é uma nova versão da mesma aula: use exemplos e exercícios diferentes dos habituais." : ""}`;

  try{
    const d = await pedirJSON({prompt, sistema});
    if(!d || !Array.isArray(d.exercicios) || !d.exercicios.length) throw new ErroIA("json", "A aula veio incompleta. Toque de novo.");
    guardarAula(id, d);
    Larissa.pensa(false);
    if(licaoAberta === id) montarLicao(l, cabeca, d);
  }catch(e){
    Larissa.pensa(false);
    if(e?.codigo === "cancelado") return;
    pintar(cabeca, h("div", {class:"panel stack-s"},
      h("p", {class:"lead"}, msgErro(e)),
      h("div", {class:"row"},
        h("button", {class:"btn primary", onclick:() => verLicao(id)}, "Tentar de novo"),
        h("button", {class:"btn", onclick:() => { aba = "ajustes"; rotear(); }}, "Abrir Ajustes"))));
  }
}

function montarLicao(l, cabeca, d){
  const teoria = h("div", {class:"panel lift stack"},
    h("p", {class:"lead", style:"font-size:15px; color:var(--ink)"}, d.resumo || ""),
    ...(d.pontos || []).map(p => h("div", {class:"stack-s"}, h("h3", {}, p.titulo), h("p", {class:"lead"}, p.texto))),
    d.atencao ? h("div", {class:"note"}, h("span", {}, "⚠️"), h("span", {}, h("b", {}, "Cuidado: "), d.atencao)) : null);

  const exemplos = h("div", {class:"stack-s"},
    h("span", {class:"eyebrow"}, "Exemplos"),
    ...(d.exemplos || []).map(x => h("div", {class:"ex", style:"display:flex; gap:11px; align-items:flex-start"},
      h("div", {style:"flex:1; min-width:0"},
        h("span", {class:"en"}, x.en), h("div", {class:"pt"}, x.pt),
        x.fig ? h("span", {class:"fig"}, x.fig) : null),
      h("button", {class:"speak", "aria-label":`Ouvir: ${x.en}`, onclick:() => falar(x.en),
        html:`<svg viewBox="0 0 24 24">${ICO.som}</svg>`}))));

  const resp = {};
  const exArea = h("div", {class:"stack"});
  const exs = (d.exercicios || []).slice(0, 5);

  exs.forEach((q, i) => {
    const bloco = h("div", {class:"panel stack-s"});
    bloco.append(h("span", {class:"eyebrow"}, `Exercício ${i+1} de ${exs.length}`),
                 h("p", {style:"margin:0; font-weight:500"}, q.pergunta));

    if(q.tipo === "escolha" && Array.isArray(q.opcoes)){
      const certa = Number(q.resposta) || 0;
      const btns = q.opcoes.map((o, oi) => h("button", {class:"opt", onclick:() => {
        if(resp[i] !== undefined) return;
        resp[i] = oi === certa;
        btns.forEach((b, bi) => {
          b.disabled = true;
          if(bi === certa) b.classList.add("right");
          else if(bi === oi) b.classList.add("wrong");
        });
        if(resp[i]) Larissa.comemora(false); else anotarErro(q.opcoes[oi], q.opcoes[certa], q.porque);
        bloco.append(h("div", {class:"why"}, q.porque || ""));
        conferir();
      }}, o));
      btns.forEach(b => bloco.append(b));
    } else {
      const campo = h("input", {class:"inp", type:"text", id:`ex${i}`, placeholder:`Escreva em ${L().adj}…`,
        autocapitalize:"none", autocorrect:"off", spellcheck:"false"});
      const certa = String(q.resposta || "");
      const enviar = h("button", {class:"btn primary sm", onclick:() => {
        if(resp[i] !== undefined) return;
        const igual = fichas(campo.value).join(" ") === fichas(certa).join(" ");
        resp[i] = igual;
        campo.disabled = true; enviar.disabled = true;
        campo.style.borderColor = igual ? "var(--good)" : "var(--bad)";
        if(!igual) anotarErro(campo.value.trim(), certa, q.porque);
        bloco.append(h("div", {class:"ex", style:"margin-top:4px"},
          h("span", {class:"en"}, certa), q.porque ? h("div", {class:"pt"}, q.porque) : null));
        if(!igual) bloco.append(h("button", {class:"btn sm", style:"align-self:flex-start",
          onclick: ev => julgar(ev.currentTarget, campo.value, certa, q.pergunta)}, "Minha resposta também vale?"));
        conferir();
      }}, "Responder");
      bloco.append(h("div", {class:"row", style:"flex-wrap:nowrap"}, campo, enviar));
    }
    exArea.append(bloco);
  });

  const fim = h("div", {class:"stack-s"});

  function conferir(){
    if(Object.keys(resp).length < exs.length) return;
    const acertos = Object.values(resp).filter(Boolean).length;
    const jaFeita = !!S.feitas[l.id];
    S.feitas[l.id] = {acertos, total:exs.length, em:Date.now()};
    if(!jaFeita) ganhar(10 + acertos * 4); else gravar();
    const p = proxima();
    if(acertos >= 4){ Larissa.comemora(); setTimeout(() => falarPT(
      acertos === exs.length ? "Perfeito! Você gabaritou." : "Muito bem! Quase tudo certo."), 700); }
    fim.replaceChildren(
      h("div", {class:"panel lift stack-s", style:"align-items:center; text-align:center"},
        h("span", {class:"eyebrow"}, "Lição concluída"),
        h("div", {class:"score", style:`color:${acertos >= 4 ? "var(--good)" : acertos >= 3 ? "var(--signal)" : "var(--bad)"}`}, `${acertos}/${exs.length}`),
        h("p", {class:"lead"}, acertos === exs.length ? "Gabaritou. Próxima." :
          acertos >= 3 ? "Bom. Os erros foram para a aba Progresso." : "Vale reler a explicação antes de seguir."),
        h("div", {class:"row", style:"justify-content:center"},
          p ? h("button", {class:"btn primary", onclick:() => { licaoAberta = p.id; rotear(); }}, "Próxima lição") : null,
          h("button", {class:"btn", onclick:() => { licaoAberta = null; rotear(); }}, "Ver trilha"))));
    fim.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  const refazerBtn = h("button", {class:"btn ghost sm", style:"align-self:flex-start; margin-left:-10px",
    onclick:() => { delete cacheLicao[l.id]; verLicao(l.id, true); }}, "↻ Gerar outra versão desta aula");

  const feita = S.feitas[l.id];
  pintar(cabeca, palco(true), teoria, exemplos, refazerBtn,
    feita ? h("div", {class:"note"}, h("span", {}, "✓"),
      h("span", {}, `Você já fez esta lição e acertou ${feita.acertos} de ${feita.total}. Refazer não tira pontos.`)) : null,
    h("span", {class:"eyebrow"}, "Agora pratique"), exArea, fim);
}

async function julgar(btn, minha, certa, pergunta){
  btn.disabled = true; btn.textContent = "Conferindo…";
  try{
    const t = await pedir({rapido:true,
      sistema:`Você é Larissa, professora de ${L().adj} brasileira. Responda em português do Brasil, no máximo 2 frases.`,
      prompt:`Um aluno traduziu para o ${L().adj} a frase: "${pergunta}"
Resposta esperada: "${certa}"
Resposta do aluno: "${minha}"
A resposta do aluno também está correta em ${L().adj} natural? Comece por "Vale" ou "Não vale".`});
    btn.replaceWith(h("div", {class:"why"}, t));
  }catch(e){ btn.disabled = false; btn.textContent = msgErro(e) || "Tentar de novo"; }
}

/* ---------- Falar ---------- */

function verFalar(){
  const seg = h("div", {class:"seg"},
    h("button", {"aria-pressed": sub === "conversa", onclick:() => { sub = "conversa"; rotear(); }}, "Conversa"),
    h("button", {"aria-pressed": sub === "pronuncia", onclick:() => { sub = "pronuncia"; rotear(); }}, "Pronúncia"));
  const corpo = sub === "conversa" ? painelConversa() : painelPronuncia();
  pintar(h("div", {class:"comLarissa"},
    h("div", {class:"stack"}, seg, corpo),
    palco()));
}

let turnos = [];
let ctl = null;

const SISTEMA_CHAT = () => {
  const n = Object.keys(S.feitas).length;
  const nivel = n < 8 ? `bem iniciante, sabe pouquíssimo ${L().adj}` : n < 20 ? "iniciante" : n < 34 ? "intermediário baixo" : "intermediário";
  return `Você é Larissa, uma professora de ${L().adj} brasileira conversando com um aluno de nível ${nivel}. Você é calorosa, paciente e breve.

O aluno pode escrever em ${L().adj} OU em português, e os dois são bem-vindos:
- Se ele escrever em ${L().adj}: responda em ${L().adj} e corrija os erros dele.
- Se ele escrever em português — uma dúvida, um pedido de ajuda, algo que ele não sabe dizer — responda a dúvida dele em português na linha PT, e use a linha EN para mostrar como aquilo se diz em ${L().adj}. Nesse caso FIX é exatamente ok.
- NUNCA trate português como ${L().adj} errado. Escrever em português não é erro.

Responda SEMPRE exatamente neste formato, quatro linhas, nada fora dele:
EN: <frase em ${L().adj}, 1 a 2 frases curtas, no nível do aluno, terminando com uma pergunta>
PT: <tradução da linha EN; ou, se ele escreveu em português, a resposta à dúvida dele>
FIX: <se ele tentou ${L().adj} e errou, só a frase dele corrigida; caso contrário, exatamente ok>
TIP: <se houver correção, uma linha em português explicando o erro; se não houver, deixe vazio>

Nunca escreva parágrafos longos. Nunca saia do formato. Nunca use asteriscos nem markdown.`;
};

function partes(t){
  const p = s => { const m = t.match(new RegExp(`^${s}:\\s*([\\s\\S]*?)(?=\\n\\s*(?:EN|PT|FIX|TIP):|$)`, "m")); return m ? m[1].trim() : ""; };
  return {en:p("EN"), pt:p("PT"), fix:p("FIX"), tip:p("TIP")};
}

function painelConversa(){
  const lista = h("div", {class:"msgs", id:"msgs", "aria-live":"polite"});
  const campo = h("textarea", {class:"inp", id:"chatbox", rows:"1", placeholder:"Escreva ou toque no microfone…",
    oninput: ev => { ev.target.style.height = "auto"; ev.target.style.height = Math.min(ev.target.scrollHeight, 120) + "px"; },
    onkeydown: ev => { if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); enviar(); } }});
  const micBtn = h("button", {class:"mic", id:"mic", "aria-label":"Falar",
    html:`<svg viewBox="0 0 24 24">${ICO.falar}</svg>`, onclick:() => alternarMic(campo)});
  const enviarBtn = h("button", {class:"btn primary", onclick:() => enviar()}, "Enviar");

  function bolha(quem, texto){
    const m = h("div", {class:"msg " + quem}, h("div", {class:"bub"}, texto));
    lista.append(m); m.scrollIntoView({behavior:"smooth", block:"nearest"});
    return m;
  }

  async function enviar(){
    const txt = campo.value.trim();
    if(!txt) return;
    campo.value = ""; campo.style.height = "auto";
    bolha("me", txt);
    turnos.push({role:"user", content:txt});

    const m = h("div", {class:"msg them"});
    const b = h("div", {class:"bub"}, "…");
    m.append(b); lista.append(m); m.scrollIntoView({behavior:"smooth", block:"nearest"});

    ctl = new AbortController();
    Larissa.pensa(true);
    try{
      const texto = await pedirStream(
        {turnos: turnos.slice(-12), sistema: SISTEMA_CHAT(), rapido:true, signal: ctl.signal},
        parcial => { const p = partes(parcial); if(p.en) b.textContent = p.en; });
      const p = partes(texto);
      turnos.push({role:"assistant", content:texto});
      b.textContent = p.en || texto;
      if(p.pt) m.append(h("div", {class:"sub"}, p.pt));
      m.append(h("button", {class:"btn ghost sm", style:"align-self:flex-start; margin-left:-10px",
        onclick:() => falar(p.en)}, "🔊 Ouvir de novo"));
      if(p.fix && p.fix.toLowerCase() !== "ok"){
        anotarErro(txt, p.fix, p.tip); gravar();
        lista.append(h("div", {class:"fixcard"},
          h("span", {class:"lbl"}, "Larissa corrigiu"),
          h("span", {class:"txt"}, p.fix),
          p.tip ? h("span", {class:"tip"}, p.tip) : null));
      }
      ganhar(3);
      if(p.fix && p.fix.toLowerCase() === "ok") Larissa.comemora();
      falar(p.en);
      lista.lastElementChild?.scrollIntoView({behavior:"smooth", block:"nearest"});
    }catch(e){
      Larissa.pensa(false);
      if(e?.codigo === "cancelado"){ m.remove(); turnos.pop(); return; }
      b.textContent = msgErro(e); b.style.color = "var(--bad)";
      turnos.pop();
    }
  }

  if(turnos.length === 0){
    lista.append(h("div", {class:"empty"},
      `Fale em ${L().adj} — nem que seja `, h("i", {}, L().oi), ` — ou pergunte em português.`,
      h("br"), "Larissa corrige o que você tentou e explica o que você não sabe."));
  } else {
    for(const t of turnos){
      if(t.role === "user") bolha("me", t.content);
      else { const p = partes(t.content); const m = bolha("them", p.en || t.content); if(p.pt) m.append(h("div", {class:"sub"}, p.pt)); }
    }
  }

  const avisos = [];
  if(!TEM_MIC) avisos.push(h("div", {class:"note"}, h("span", {}, "🎙️"),
    h("span", {}, h("b", {}, "Sem reconhecimento de voz neste navegador. "),
      "Dá para escrever normalmente, e a Larissa continua falando com você. Para falar, use o Chrome — no Safari do iPhone o reconhecimento não é confiável.")));

  return h("div", {class:"stack"}, ...avisos,
    h("div", {class:"panel lift"}, lista, h("div", {class:"composer"}, campo, TEM_MIC ? micBtn : null, enviarBtn)),
    turnos.length ? h("button", {class:"btn ghost sm", style:"align-self:center",
      onclick:() => { turnos = []; rotear(); }}, "Limpar conversa") : null);
}

function alternarMic(campo){
  const b = $("mic");
  if(gravando){ pararMic(); b.classList.remove("rec"); return; }
  b.classList.add("rec");
  ouvir({
    onParcial: t => { campo.value = t; },
    onFim: t => { b.classList.remove("rec"); campo.value = t; campo.focus(); },
    onErro: err => { b.classList.remove("rec"); if(err !== "aborted" && err !== "no-speech") campo.placeholder = "Não consegui ouvir. Escreva aqui."; },
  });
}

/* ---------- Pronúncia ---------- */

let banco = "base", idx = 0;
const frases = () => (banco === "extra" && L().extra) ? L().extra.lista : L().frases;

function painelPronuncia(){
  const lista = frases();
  const f = lista[idx % lista.length];
  const melhor = S.falados[f.en];

  const palavrasEl = h("div", {class:"target", id:"alvo"},
    ...fichas(f.en).map((w, i) => h("span", {class:"w", id:"w"+i}, w)));
  const resultado = h("div", {class:"stack-s", id:"resultado"});
  const micBtn = h("button", {class:"mic", id:"pmic", style:"width:62px; height:62px",
    "aria-label":"Gravar minha fala", html:`<svg viewBox="0 0 24 24">${ICO.falar}</svg>`,
    onclick:() => gravarFrase(f)});

  const troca = h("div", {class:"seg", style:"max-width:340px"},
    h("button", {"aria-pressed": banco === "base", onclick:() => { banco = "base"; idx = 0; rotear(); }}, "Básicas"),
    L().extra
      ? h("button", {"aria-pressed": banco === "extra", onclick:() => { banco = "extra"; idx = 0; rotear(); }}, "Frases ISP")
      : null);

  const avisos = [];
  if(!TEM_MIC) avisos.push(h("div", {class:"note"}, h("span", {}, "🎙️"),
    h("span", {}, h("b", {}, "Este navegador não reconhece voz. "),
      "Abra no Chrome (Android ou computador) para usar o treino de pronúncia. Ouvir a Larissa funciona aqui do mesmo jeito.")));

  return h("div", {class:"stack"},
    ...avisos, troca,
    h("span", {class:"eyebrow"}, banco === "extra" && L().extra ? L().extra.nome : "Frases da trilha"),
    h("div", {class:"panel lift stack"},
      palavrasEl,
      f.fig ? h("span", {class:"fig", style:"font-size:14px"}, f.fig) : null,
      h("div", {class:"row"},
        h("button", {class:"btn sm", onclick:() => falar(f.en, 0.78)}, "🔊 Devagar"),
        h("button", {class:"btn sm", onclick:() => falar(f.en, 1)}, "🔊 Normal"),
        melhor ? h("span", {class:"chip"}, `melhor: ${melhor}%`) : null),
      h("div", {style:"display:flex; justify-content:center; padding:6px 0"}, TEM_MIC ? micBtn : null),
      h("p", {class:"lead", style:"text-align:center; margin:0; font-size:13px"},
        TEM_MIC ? "Toque, leia a frase em voz alta e espere." : "Só leitura neste navegador."),
      resultado),
    h("div", {class:"row", style:"justify-content:space-between"},
      h("button", {class:"btn sm", onclick:() => { idx = (idx - 1 + lista.length) % lista.length; rotear(); }}, "‹ Anterior"),
      h("span", {class:"chip"}, `${(idx % lista.length) + 1} / ${lista.length}`),
      h("button", {class:"btn sm", onclick:() => { idx = (idx + 1) % lista.length; rotear(); }}, "Próxima ›")),
    h("div", {class:"note"}, h("span", {}, "ℹ️"),
      h("span", {}, h("b", {}, "Como a nota sai: "),
        "comparo o que o reconhecimento de voz do seu aparelho entendeu com a frase alvo. É um bom indicador — se ele ouve ",
        h("i", {}, "tree"), " no lugar de ", h("i", {}, "three"), ", seu TH precisa de treino — mas não é uma nota por fonema. Às vezes o erro é do reconhecimento, não seu.")));
}

function gravarFrase(f){
  const b = $("pmic"), res = $("resultado");
  if(gravando){ pararMic(); b.classList.remove("rec"); return; }
  b.classList.add("rec");
  res.replaceChildren(h("p", {class:"lead", style:"text-align:center"}, "Ouvindo…"));

  ouvir({
    onParcial: t => res.replaceChildren(h("p", {class:"heard", style:"text-align:center"}, t)),
    onErro: err => {
      b.classList.remove("rec");
      res.replaceChildren(h("p", {class:"lead", style:"text-align:center"},
        err === "not-allowed" ? "Você precisa permitir o microfone no navegador." :
        err === "no-speech" ? "Não ouvi nada. Tente de novo mais perto." : "O microfone falhou. Tente de novo."));
    },
    onFim: ouvido => {
      b.classList.remove("rec");
      if(!ouvido) return res.replaceChildren(h("p", {class:"lead", style:"text-align:center"}, "Não ouvi nada. Tente de novo."));

      const {ok, pct, palavras} = alinhar(f.en, ouvido);
      palavras.forEach((w, i) => { const el = $("w"+i); if(el) el.className = "w " + (ok[i] ? "hit" : "miss"); });
      const errou = palavras.filter((w, i) => !ok[i]);

      if(!S.falados[f.en] || pct > S.falados[f.en]) S.falados[f.en] = pct;
      ganhar(pct >= 80 ? 5 : 2);
      if(pct >= 85) Larissa.comemora();

      const cor = pct >= 85 ? "var(--good)" : pct >= 60 ? "var(--signal)" : "var(--bad)";
      res.replaceChildren(
        h("div", {style:"display:flex; align-items:center; gap:14px; justify-content:center"},
          h("span", {class:"score", style:`color:${cor}`}, pct + "%"),
          h("span", {class:"lead", style:"text-align:left"},
            pct >= 85 ? "Muito bom. Passe para a próxima." :
            pct >= 60 ? "Quase. Repita focando nas palavras marcadas." :
            "Ouça devagar e repita imitando o som, não a escrita.")),
        h("p", {class:"heard", style:"text-align:center"}, "ouvi: " + ouvido),
        errou.length
          ? h("button", {class:"btn wide", onclick: ev => explicarFala(ev.currentTarget, f.en, ouvido, errou)},
              "Perguntar à Larissa por que errei")
          : null);
    },
  });
}

async function explicarFala(btn, alvo, ouvido, errou){
  btn.disabled = true;
  btn.replaceChildren(h("span", {class:"spin"}), document.createTextNode(" Larissa está ouvindo…"));
  try{
    const t = await pedir({
      sistema:`Você é Larissa, professora de ${L().adj} brasileira. Responda em português do Brasil, em no máximo 4 linhas curtas. Use pronúncia figurada brasileira entre aspas. Sem markdown.`,
      prompt:`Um aluno brasileiro tentou dizer esta frase em ${L().adj} em voz alta:
ALVO: "${alvo}"
O reconhecimento de voz do aparelho entendeu: "${ouvido}"
Palavras do alvo que não bateram: ${errou.join(", ")}

Explique o que provavelmente saiu errado na pronúncia dessas palavras e como corrigir. Se for provável que o aluno falou certo e só o reconhecimento falhou, diga isso primeiro.`});

async function apiAlunos(metodo, corpo){
  let t = null;
  try{ t = await AUTH?.currentUser?.getIdToken?.(); }catch(e){}
  if(!t) throw new Error("Sua sessão expirou. Saia e entre de novo.");
  const cab = {"Authorization": "Bearer " + t};
  if(corpo) cab["content-type"] = "application/json";
  const r = await fetch(`${PROXY}/api/alunos`, {
    method: metodo, headers: cab,
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.erro || "Não consegui falar com o servidor.");
  return d;
}

const quando = ms => {
  if(!ms) return "nunca entrou";
  const d = new Date(ms), h = new Date();
  const dia = d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"});
  const hora = d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  return d.toDateString() === h.toDateString() ? `hoje às ${hora}` : `${dia} às ${hora}`;
};

async function treinarErros(btn){
  const alvo = $("drill");
  btn.disabled = true; btn.textContent = "Montando…";
  const lista = S.erros.slice(0, 12).map(e => `- errado: "${e.was}" | certo: "${e.now}"`).join("\n");
  try{
    const d = await pedirJSON({
      sistema:`Você é Larissa, professora de ${L().adj} brasileira. Responda somente com JSON válido, sem texto fora dele. Enunciados em português do Brasil.`,
      prompt:`Estes são erros reais de ${L().adj} de um aluno brasileiro:
${lista}

Monte 5 perguntas de revisão de múltipla escolha focadas exatamente nesses erros.
Formato: {"q":[{"pergunta":"enunciado em português","opcoes":["a","b","c"],"resposta":0,"porque":"explicação curta em português"}]}`});
    btn.disabled = false; btn.textContent = "Treinar meus erros";
    const qs = (d?.q || []).slice(0, 5);
    if(!qs.length) throw new ErroIA("json", "A revisão veio vazia. Toque de novo.");

    let feitas = 0, acertos = 0;
    const box = h("div", {class:"panel lift stack"}, h("span", {class:"eyebrow"}, "Revisão dos seus erros"));
    qs.forEach(q => {
      const bl = h("div", {class:"stack-s"}, h("p", {style:"margin:0; font-weight:500"}, q.pergunta));
      const certa = Number(q.resposta) || 0;
      const btns = (q.opcoes || []).map((o, oi) => h("button", {class:"opt", onclick:() => {
        btns.forEach((b2, bi) => { b2.disabled = true; if(bi === certa) b2.classList.add("right"); else if(bi === oi) b2.classList.add("wrong"); });
        bl.append(h("div", {class:"why"}, q.porque || ""));
        feitas++; if(oi === certa) acertos++;
        if(feitas === qs.length){
          ganhar(acertos * 5);
          box.append(h("div", {class:"note"}, h("span", {}, "✓"), h("span", {}, `${acertos} de ${qs.length}. +${acertos*5} xp.`)));
        }
      }}, o));
      btns.forEach(b2 => bl.append(b2));
      box.append(bl);
    });
    alvo.replaceChildren(box);
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  }catch(e){
    btn.disabled = false; btn.textContent = "Treinar meus erros";
    alvo.replaceChildren(h("div", {class:"note"}, h("span", {}, "⚠️"), h("span", {}, msgErro(e))));
  }
}

        `${Object.keys(cacheLicao).length} aulas já geradas e guardadas neste aparelho. Elas abrem na hora, funcionam sem internet e não gastam cota do Gemini de novo.`),
      h("button", {class:"btn ghost sm", style:"align-self:flex-start", onclick: limparAulas}, "Limpar aulas salvas")),

    h("div", {class:"note warn"}, h("span", {}, "🔐"),
      h("span", {}, h("b", {}, "Sobre a chave: "),
        "ela fica só neste aparelho e vai direto do seu navegador para o Google. Como está no navegador, quem abrir esta página consegue lê-la — para uso pessoal tudo bem, só não divulgue o endereço. Se um dia publicar, restrinja a chave por site no Google Cloud ou coloque um proxy na frente.")));
}

async function testar(btn, chave, modelo){
  const antes = CFG.chave, antesM = CFG.modelo;
  CFG.chave = chave; CFG.modelo = modelo;
  btn.disabled = true; btn.replaceChildren(h("span", {class:"spin"}), document.createTextNode(" Testando…"));
  try{
    await pedir({prompt:"Responda apenas: ok", rapido:true});
    btn.textContent = "✓ Funcionando";
    btn.style.color = "var(--good)";
    gravarCfg();
  }catch(e){
    CFG.chave = antes; CFG.modelo = antesM;
    btn.textContent = msgErro(e);
    btn.style.color = "var(--bad)";
  }finally{
    btn.disabled = false;
    setTimeout(() => { btn.textContent = "Testar conexão"; btn.style.color = ""; }, 5000);
  }
}

function exportar(){
  try{
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `destrava-progresso-${hoje()}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }catch(e){ alert("Não consegui gerar o arquivo neste navegador."); }
}

function importar(){
  const inp = h("input", {type:"file", accept:"application/json,.json", style:"display:none"});
  inp.addEventListener("change", async () => {
    const f = inp.files?.[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!d || typeof d !== "object" || !d.feitas) throw 0;
      S = Object.assign(NOVO(), d);
      gravar(); rotear();
      alert("Progresso importado.");
    }catch(e){ alert("Esse arquivo não parece um backup do Destrava."); }
    inp.remove();
  });
  document.body.append(inp); inp.click();
}

function apagar(){
  if(!confirm("Isso apaga lições concluídas, xp, streak e a lista de erros. Não dá para desfazer. Apagar?")) return;
  S = NOVO(); gravar(); rotear();
}

/* ============================ 7. LOGIN E BOOT ============================ */

const chips = () => document.querySelectorAll(".topbar .chip");

function verLogin(aviso, semLogin){
  $("nav").hidden = true;
  chips().forEach(c => { c.hidden = true; });

  const email = h("input", {class:"inp", type:"email", id:"login-email",
    placeholder:"seu@email.com", autocomplete:"username", autocapitalize:"none", spellcheck:"false"});
  const senha = h("input", {class:"inp", type:"password", id:"login-senha",
    placeholder:"sua senha", autocomplete:"current-password"});
  const recado = h("p", {class:"lead", style:"color:var(--bad)", hidden: !aviso}, aviso || "");
  const entrar = h("button", {class:"btn primary wide"}, "Entrar");

  async function tentar(){
    const e = email.value.trim(), p = senha.value;
    if(!e || !p){ recado.textContent = "Preencha e-mail e senha."; recado.hidden = false; return; }
    if(!AUTH){ recado.textContent = "O login não carregou. Recarregue a página."; recado.hidden = false; return; }
    entrar.disabled = true; entrar.replaceChildren(h("span", {class:"spin"}), document.createTextNode(" Entrando…"));
    try{
      await AUTH.signInWithEmailAndPassword(e, p);   // onAuthStateChanged assume daqui
    }catch(err){
      recado.textContent = msgAuth(err); recado.hidden = false;
      entrar.disabled = false; entrar.textContent = "Entrar";
    }
  }
  entrar.addEventListener("click", tentar);
  senha.addEventListener("keydown", ev => { if(ev.key === "Enter") tentar(); });

  async function esqueci(){
    const e = email.value.trim();
    if(!e){ recado.textContent = "Escreva seu e-mail primeiro."; recado.hidden = false; return; }
    try{
      await AUTH.sendPasswordResetEmail(e);
      recado.style.color = "var(--good)";
      recado.textContent = "Enviei um link de redefinição para " + e + ".";
      recado.hidden = false;
    }catch(err){ recado.style.color = "var(--bad)"; recado.textContent = msgAuth(err); recado.hidden = false; }
  }

  pintar(
    h("div", {class:"hero"},
      h("span", {class:"eyebrow"}, "Acesso"),
      h("h2", {}, "Entre para estudar"),
      h("p", {class:"lead"}, "A Larissa ensina inglês e italiano. Use o e-mail e a senha que você recebeu."),
      email, senha, recado, entrar,
      h("button", {class:"btn ghost sm", style:"align-self:center", onclick: esqueci}, "Esqueci minha senha")),

    semLogin
      ? h("div", {class:"panel stack-s"},
          h("div", {class:"note warn"}, h("span", {}, "⚠️"),
            h("span", {}, h("b", {}, "O login ainda não foi ativado neste projeto. "),
              "Enquanto isso, dá para estudar sem conta — o progresso fica só neste aparelho e ninguém é monitorado.")),
          h("button", {class:"btn primary wide", onclick:() => entrarNoApp("local", "modo pessoal, sem login")},
            "Estudar sem conta neste aparelho"))
      : h("div", {class:"note"}, h("span", {}, "🔑"),
          h("span", {}, h("b", {}, "Sem acesso? "),
            "As contas são criadas pelo administrador — não há cadastro aberto nesta página.")));
}

function chaves(){
  const base = UID === "local" ? "" : "." + UID;
  LS = "destrava.estado.v1" + base + "." + IDIOMA;
  LS_CFG = "destrava.cfg.v1" + base;
}

/* A escolha do idioma e por pessoa, e fica guardada: quem ja escolheu volta
   direto para onde parou. */
const LS_IDIOMA = () => "destrava.idioma" + (UID && UID !== "local" ? "." + UID : "");

function idiomaSalvo(){
  try{ const v = localStorage.getItem(LS_IDIOMA()); return IDIOMAS[v] ? v : null; }
  catch(e){ return null; }
}

function progressoDe(k){
  const base = UID === "local" ? "" : "." + UID;
  try{
    const r = localStorage.getItem("destrava.estado.v1" + base + "." + k);
    if(!r) return 0;
    return Object.keys(JSON.parse(r).feitas || {}).length;
  }catch(e){ return 0; }
}

function verEscolha(podeVoltar){
  $("nav").hidden = true;
  chips().forEach(c => { c.hidden = true; });

  const cartao = k => {
    const d = IDIOMAS[k], feitas = progressoDe(k), tot = d.licoes.length;
    return h("button", {class:"cartao", onclick:() => definirIdioma(k)},
      h("span", {class:"sigla"}, d.bandeira),
      h("span", {class:"nome"}, d.nome),
      h("span", {class:"info"}, feitas ? `${feitas} de ${tot} lições feitas` : `${tot} lições, do zero`),
      h("div", {class:"bar"}, h("i", {style:`width:${Math.round(100*feitas/tot)}%`})),
      h("span", {class:"info", style:"color:var(--accent); font-weight:600"},
        feitas ? "Continuar de onde parei ›" : "Começar ›"));
  };

  pintar(
    h("div", {class:"stack-s", style:"text-align:center; align-items:center; padding-top:8px"},
      h("span", {class:"eyebrow"}, "Primeiro, escolha"),
      h("h2", {}, "O que você quer estudar?"),
      h("p", {class:"lead"}, "A Larissa ensina os dois. Você troca quando quiser, e cada idioma guarda o próprio progresso.")),
    h("div", {class:"escolha"}, cartao("en"), cartao("it")),
    podeVoltar
      ? h("button", {class:"btn ghost sm", style:"align-self:center",
          onclick:() => { if(idiomaSalvo()) abrirApp(); }}, "‹ Voltar sem trocar")
      : null);
}

function definirIdioma(k){
  IDIOMA = k;
  try{ localStorage.setItem(LS_IDIOMA(), k); }catch(e){}
  abrirApp();
}

/* Abre o app no idioma corrente, do ponto onde a pessoa parou. */
function abrirApp(){
  chaves();
  // O ingles herda o progresso de antes de o italiano existir.
  S = ler(LS, NOVO, IDIOMA === "en" ? ["destrava.estado.v1." + UID, "destrava.estado.v1", "larissa.estado.v1"] : []);
  CFG = ler(LS_CFG, CFG_NOVO, ["destrava.cfg.v1", "larissa.cfg.v1"]);
  if(!MODELOS.some(m => m.v === CFG.modelo)) CFG.modelo = CFG_NOVO().modelo;
  carregarVozes();

  $("nav").hidden = false;
  chips().forEach(c => { c.hidden = false; });
  aba = "trilha"; licaoAberta = null; turnos = []; banco = "base"; idx = 0;
  pintarTopo();
  rotear();
  puxarDaNuvem();
  sondarServidor().then(() => { if(SERVIDOR) rotear(); });
}

function entrarNoApp(uid, email){
  UID = uid; EMAIL = email || "(sem e-mail)";
  const salvo = idiomaSalvo();
  if(!salvo) return verEscolha(false);   // ninguem entra sem escolher
  IDIOMA = salvo;
  abrirApp();
}

function semAuth(){
  pintar(h("div", {class:"panel stack-s"},
    h("h2", {}, "Login indisponível"),
    h("p", {class:"lead"},
      "Não consegui carregar o Firebase Authentication. Verifique sua conexão e recarregue a página.")));
}

/* Pergunta ao Google se o login por e-mail/senha existe neste projeto. Uma
   credencial proposital invalida: se o login estiver ligado, ele responde
   "credencial invalida"; se nao estiver, responde que nao ha configuracao. */
async function loginAtivado(){
  try{
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB.apiKey}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email:"sonda@destrava.invalid", password:"sonda-apenas", returnSecureToken:true}),
    });
    const m = (await r.json())?.error?.message || "";
    return !(m === "CONFIGURATION_NOT_FOUND" || m === "OPERATION_NOT_ALLOWED");
  }catch(e){ return true; }   // na dúvida, mostra o login normal
}

function iniciarAuth(){
  if(typeof firebase === "undefined" || !firebase.auth) return semAuth();
  try{
    firebase.initializeApp(FB);
    AUTH = firebase.auth();
    try{ NUVEM = firebase.firestore(); }catch(e){ NUVEM = null; }
    AUTH.onAuthStateChanged(async u => {
      if(u) return entrarNoApp(u.uid, u.email);
      verLogin(undefined, !(await loginAtivado()));
    });
  }catch(e){ semAuth(); }
}

$("nav").hidden = true;
chips().forEach(c => { c.hidden = true; });
pintar(h("div", {class:"panel", style:"display:flex; gap:10px; align-items:center"},
  h("span", {class:"spin"}), h("span", {class:"lead"}, "Carregando…")));
iniciarAuth();
</script>
